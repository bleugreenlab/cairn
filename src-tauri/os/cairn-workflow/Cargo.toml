[package]
name = "cairn-workflow"
version.workspace = true
edition = "2021"
license = "BUSL-1.1"
description = "Durable recipe advancement, effect processing, and workflow persistence"

[dependencies]
evalexpr = "11"
async-trait = "0.1"
tracing = "0.1"
cairn-common = { path = "../cairn-common" }
cairn-config = { path = "../cairn-config" }
cairn-db = { path = "../cairn-db" }
cairn-llm-types = { path = "../cairn-llm-types" }
cairn-models = { path = "../cairn-models" }
cairn-platform = { path = "../cairn-platform" }
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cairn-db = { path = "../cairn-db", features = ["test-utils"] }
cairn-platform = { path = "../cairn-platform", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
test-utils = ["cairn-db/test-utils", "cairn-platform/test-utils"]
