[package]
name = "cairn-speech-wire"
version.workspace = true
edition = "2021"
description = "Cairn speech wires: ElevenLabs' stream-input WebSocket and OpenAI-compatible audio/speech"
license = "BUSL-1.1"

# A leaf like cairn-llm-wire: it reaches no other workspace crate, and the
# cairn-models facet maps its DTOs and errors onto the catalog and usage
# vocabulary. Blocking throughout, so it needs no async runtime.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
# The synchronous WebSocket client. Its TLS goes through this crate's own rustls
# config (src/tls.rs): tungstenite's built-in one calls `ClientConfig::builder()`,
# which panics when both rustls crypto providers are compiled into the graph.
# HTTP uses reqwest's own TLS.
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
