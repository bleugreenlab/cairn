[package]
name = "cairn-models-types"
version.workspace = true
edition = "2021"
description = "Cairn Models facet vocabulary: provider ids, the provider catalog, usage windows and snapshots, and pooled capacity"
license = "BUSL-1.1"

# A leaf: vocabulary consumers (configuration, workflow, the desktop tray) depend
# on it without pulling in the token layer or anything heavier.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"
