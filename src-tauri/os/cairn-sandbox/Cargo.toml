[package]
name = "cairn-sandbox"
version.workspace = true
edition = "2021"
rust-version = "1.85"
license = "BUSL-1.1"

[dependencies]
cairn-common = { path = "../cairn-common" }
chrono = "0.4"
dirs = "6"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
