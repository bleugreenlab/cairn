[package]
name = "cairn-config"
version.workspace = true
edition = "2021"
description = "Cairn configuration files, defaults, validation, and preset resolution"
license = "BUSL-1.1"

[dependencies]
cairn-models-types = { path = "../cairn-models-types" }
cairn-domain = { path = "../cairn-domain" }
cairn-common = { path = "../cairn-common" }
cairn-platform = { path = "../cairn-platform" }
cairn-packs = { path = "../cairn-packs" }
cairn-symbols = { path = "../cairn-symbols" }
cairn-sandbox = { path = "../cairn-sandbox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = "1"
log = "0.4"
dirs = "5"
tempfile = "3"

[features]
test-utils = []
