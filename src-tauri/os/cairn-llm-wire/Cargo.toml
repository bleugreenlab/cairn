[package]
name = "cairn-llm-wire"
version.workspace = true
edition = "2021"
description = "Cairn model wires: the HTTP protocol families with generation assembly and replay, and the Claude stream-json and Codex app-server CLI streams"
license = "BUSL-1.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
