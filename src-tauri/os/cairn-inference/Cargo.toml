[package]
name = "cairn-inference"
version.workspace = true
edition = "2021"
description = "The cairn-inference facet: profile, deployment and pool records, the pin-over-default resolver, the act side and the pool controller"
license = "BUSL-1.1"

# A pure library with no storage of its own: the host persists the inventory.
# It reaches only the models facet's vocabulary (for `VerbKind`), so an
# application outside Cairn can host it.
[dependencies]
cairn-models-types = { path = "../cairn-models-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
