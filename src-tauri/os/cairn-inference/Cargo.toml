[package]
name = "cairn-inference"
version.workspace = true
edition = "2021"
description = "The cairn-inference facet: recipe, deployment and pool records, the pin-over-default resolver, and the bginf mirror import"
license = "BUSL-1.1"

# A pure library with no storage of its own: the host persists the inventory.
# It reaches only the models facet's vocabulary (for `VerbKind`), so an
# application outside Cairn can run the bginf import and comparison from it.
[dependencies]
cairn-models-types = { path = "../cairn-models-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
