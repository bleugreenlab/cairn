# Engine templates generation fills in: which image serves which weights on
# which hardware. Each image is pinned by the digest its registry served when
# it was chosen; a template is changed by changing its digest here, and every
# profile generated from it records which template it came from.
#
# `command` is the full serving command with the container's entrypoint
# cleared; generation appends the flags it computes (context, memory share,
# tensor parallelism, and the rendezvous flags of a profile spanning machines).
# `notes` is what the research behind a template found worth knowing when
# running it; the generating agent reads it, and a starting profile carries it.
#
# A template serves a pool whose machines all have its accelerator `family`
# and, when it names one, its CPU `arch`. The container's GPU options follow
# from family and runtime when the profile is rendered (`render.rs`): NVIDIA
# through the container runtime's GPU support, AMD through its device nodes.
#
# No container reaches an Apple GPU, so Apple's templates are native: an
# `artifact` pinned by URL, version and sha256 instead of an `image`, and a
# `command` whose first word is the program in it (a path inside an archive,
# or a console script of a wheel). Their arguments read the pinned files from
# the machine's own Hugging Face cache (`{cache}`, `{snapshot}`, `{weights}`).

# vLLM on DGX Spark (GB10, aarch64): NVIDIA's NGC build, the one bginf's
# Qwen3.6 ran. nvcr.io/nvidia/vllm:26.05.post1-py3.
- id: vllm-ngc
  server: vllm
  family: nvidia
  runtime: cuda
  arch: aarch64
  image: nvcr.io/nvidia/vllm@sha256:94e21552f644e0c1627464ba89d2f7a4ce7442e196f72afa0bb5d7fba23cbb03
  formats: [safetensors]
  command: [vllm, serve, "{model}", --revision, "{revision}", --served-model-name, "{servedName}", --host, 0.0.0.0, --port, "{port}"]

# vLLM on x86_64 NVIDIA cards: the upstream release image,
# vllm/vllm-openai:v0.32.0.
- id: vllm-openai
  server: vllm
  family: nvidia
  runtime: cuda
  arch: x86_64
  image: docker.io/vllm/vllm-openai@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
  formats: [safetensors]
  command: [vllm, serve, "{model}", --revision, "{revision}", --served-model-name, "{servedName}", --host, 0.0.0.0, --port, "{port}"]

# llama.cpp's server on NVIDIA, for GGUF weights.
# ghcr.io/ggml-org/llama.cpp:server-cuda.
- id: llamacpp-cuda
  server: llamaCpp
  family: nvidia
  runtime: cuda
  image: ghcr.io/ggml-org/llama.cpp@sha256:75037a842f2ec1d1b5317ce64078bbb4a2a134238e91a755c10ce31d8f90550a
  formats: [gguf]
  command: [/app/llama-server, -m, "{weights}", --alias, "{servedName}", --host, 0.0.0.0, --port, "{port}", -ngl, "999"]

# llama.cpp's server on AMD through Vulkan, for GGUF weights: the build halo
# has run its embedder on (server-vulkan, b11681).
- id: llamacpp-vulkan
  server: llamaCpp
  family: amd
  runtime: vulkan
  image: ghcr.io/ggml-org/llama.cpp@sha256:afdc5265d1cfc729ad3ebaac59fd60e5d15c3b7aef455d7dc16bc1dccbc4dc64
  formats: [gguf]
  command: [/app/llama-server, -m, "{weights}", --alias, "{servedName}", --host, 0.0.0.0, --port, "{port}", -ngl, "999"]

# llama.cpp's server on AMD through ROCm (HIP), for GGUF weights:
# ghcr.io/ggml-org/llama.cpp:server-rocm, b12063 (2cbca389f), built on ROCm
# 7.2.1 by upstream's .devops/rocm.Dockerfile. amd64 only.
- id: llamacpp-rocm
  server: llamaCpp
  family: amd
  runtime: rocm
  arch: x86_64
  image: ghcr.io/ggml-org/llama.cpp@sha256:cac35f0d13f73fb3bd533f7287ff59701cc5d3742c3af0a0a829d05b96d4b38e
  formats: [gguf]
  command: [/app/llama-server, -m, "{weights}", --alias, "{servedName}", --host, 0.0.0.0, --port, "{port}", -ngl, "999"]
  notes: >-
    Upstream's ROCm 7.2.1 build compiles gfx908, gfx90a, gfx942, gfx1030,
    gfx1100-gfx1102, gfx1150, gfx1151 (Strix Halo, Radeon 8060S), gfx1200 and
    gfx1201 natively, so no HSA_OVERRIDE_GFX_VERSION is needed for them; a GPU
    outside that list is not served by this image. The host needs only the
    amdgpu kernel driver exposing /dev/kfd and /dev/dri: the ROCm userspace is
    in the image. On Strix Halo, ROCm generally prefills faster than Vulkan and
    Vulkan sometimes decodes faster (strixhalo.wiki/AI/llamacpp-with-ROCm).

# vLLM on AMD through ROCm: vLLM's own ROCm release image,
# vllm/vllm-openai-rocm:v0.33.0 (the same as its v0.33.0-rocm100 tag, ROCm
# 10.0). amd64 only.
- id: vllm-rocm
  server: vllm
  family: amd
  runtime: rocm
  arch: x86_64
  image: docker.io/vllm/vllm-openai-rocm@sha256:4fcd39b758b660c4e9c345c021e2ea8f0ccdb31e3c32507d676cc3005ae83fba
  formats: [safetensors]
  command: [vllm, serve, "{model}", --revision, "{revision}", --served-model-name, "{servedName}", --host, 0.0.0.0, --port, "{port}"]
  notes: >-
    The image's PyTorch is built for gfx90a, gfx942, gfx950, gfx1100, gfx1101,
    gfx1150, gfx1151 (Strix Halo), gfx1200 and gfx1201; its AITER kernels for
    gfx942 and gfx950 only, so other GPUs take the Triton paths. On gfx1151 a
    vLLM maintainer confirmed the upstream ROCm image serving on a Radeon 8060S,
    and older releases hung in graph capture (vllm-project/vllm#32180): if a
    load stalls there, add --enforce-eager. On Strix Halo llama.cpp is usually
    the faster engine for one stream.

# llama.cpp's server on Apple silicon through Metal, for GGUF weights, run
# natively: upstream's macOS arm64 release build b12283, which carries its
# Metal library beside the binary (`llama-b12283/`).
- id: llamacpp-metal
  server: llamaCpp
  family: apple
  runtime: metal
  arch: aarch64
  artifact:
    url: https://github.com/ggml-org/llama.cpp/releases/download/b12283/llama-b12283-bin-macos-arm64.tar.gz
    version: b12283
    sha256: bbc2abe2001293687540fb274bf4114b27b56af1fc166ee76730f64996d68b00
    packaging: {kind: archive}
  formats: [gguf]
  command: [llama-b12283/llama-server, -m, "{weights}", --alias, "{servedName}", --host, 0.0.0.0, --port, "{port}", -ngl, "999"]
  notes: >-
    Metal lets the GPU wire about 84% of the machine's memory on macOS 26 (a
    128 GiB M4 Max reports 110100 MiB to `llama-server --list-devices`); a
    model past that fails to load rather than paging. The server listens on
    every interface as the executor's account, so if macOS's application
    firewall is on it must allow llama-server once. This is the engine for an
    embedding model on Apple, and for a vision model's image input (with its
    projector), since MLX's server serves neither.

# MLX on Apple silicon: mlx-lm's server, for the MLX quantizations
# mlx-community publishes. The mlx-lm 0.32.2 wheel from PyPI, installed by
# Cairn's uv on Python 3.12 with its dependencies (mlx among them) resolved as
# PyPI stood on 2026-10-17.
- id: mlxlm-metal
  server: mlxLm
  family: apple
  runtime: metal
  arch: aarch64
  artifact:
    url: https://files.pythonhosted.org/packages/d1/4f/000eefdeb41388782b47e7f39904cf2d9e7e49a60df5e172097c358dba8e/mlx_lm-0.32.2-py3-none-any.whl
    version: 0.32.2
    sha256: 5c0991248cfff5872503d74f466d2532dd8cb7fb3670cb9be7a06d7305dadc04
    packaging: {kind: wheel, python: "3.12", resolvedBefore: "2026-10-17T00:00:00Z"}
  formats: [mlx]
  command: [mlx_lm.server, --model, "{snapshot}", --host, 0.0.0.0, --port, "{port}"]
  notes: >-
    mlx_lm.server serves chat and text completions only: no embeddings and no
    image input, which on Apple are llama.cpp's. It takes no context limit
    and sizes its KV cache by each request; its default answer length is 512
    tokens unless a request asks for more (--max-tokens changes it). Cairn
    starts it through a launcher that loads the model before it listens and
    answers to the served name, both of which the bare server does not do.
