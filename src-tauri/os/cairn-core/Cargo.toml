[package]
name = "cairn-core"
build = "build.rs"
version.workspace = true
edition = "2021"
description = "Core business logic library for Cairn agent orchestration — no Tauri dependency"
license = "BUSL-1.1"
repository = "https://github.com/bleugreenlab/cairn"
homepage = "https://cairn.computer"
keywords = ["agent", "orchestration", "mcp"]

[dependencies]
cairn-attention = { path = "../cairn-attention" }
cairn-workflow = { path = "../cairn-workflow" }
cairn-session = { path = "../cairn-session" }
cairn-config = { path = "../cairn-config" }
cairn-models = { path = "../cairn-models" }
cairn-channels = { path = "../cairn-channels" }
cairn-platform = { path = "../cairn-platform" }
cairn-packs = { path = "../cairn-packs" }
cairn-checkenv = { path = "../cairn-checkenv" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
unigram = "0.2"
regex = "1"
pulldown-cmark = "0.13"
# rustls over the platform's own root store, never native-tls: reqwest's
# default-tls routes through openssl-sys, which refuses to cross-compile, and
# cairn-core is in cairn-runner's graph so it decides the aarch64-linux sidecar
# leg's TLS backend too. Native roots (not webpki) keep trust anchored in the
# OS store, so user- and enterprise-installed CAs still resolve on the desktop.
# charset/http2/macos-system-configuration are default features re-enabled by
# hand; only default-tls is being dropped.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
] }
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "net", "process", "io-util"] }
portable-pty = "0.8"
log = "0.4"
# Direct tracing dependency: the backend resource sampler (`pressure`) gates on
# `tracing::event_enabled!(target: "profiler", ...)` to stay a no-op while the
# profiler target is off, and instrumented backend work opens `profiler`-target
# spans (the span-duration layer). Everywhere else cairn-core logs via `log`.
tracing = "0.1"
nix = { version = "0.29", features = ["signal"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
dirs = "5"
thiserror = "2"
url = "2"
serde_yaml = "0.9"
toml = "0.8"
json5 = "0.4"
base64 = "0.22"
# Volatile, non-elidable zeroing for the secret registry's plaintext. A manual
# clearing loop is a valid optimization target and can be removed entirely.
zeroize = "1"
rand = "0.8"
chacha20poly1305 = "0.10"
crypto_box = "0.9"
sha2 = "0.10"
hostname = "0.4"
whoami = "1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
futures-util = "0.3"
async-trait = "0.1"
cairn-common = { path = "../cairn-common" }
cairn-tokenize = { path = "../cairn-tokenize" }
cairn-sandbox = { path = "../cairn-sandbox" }
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
tempfile = "3"
crossbeam-channel = "0.5"
zip = "4.2"
jsonschema = { version = "0.26", default-features = false }
# Structural code intelligence (ast-grep) is quarantined behind cairn-symbols so
# cairn-core no longer compiles the tree-sitter grammars directly. The crate also
# owns the shared glob/path/format helpers used by logical project search.
cairn-symbols = { path = "../cairn-symbols" }

# The gix + zstd event-codec/object substrate (tagged payload compression, the
# in-memory layered git ObjectStore, range packfile construction, and committed
# diff rendering) is quarantined behind cairn-codec so cairn-core no longer
# compiles gix or zstd directly. Its hex-sha-keyed API keeps gix types out of
# cairn-core entirely; the load-bearing gix rationale now lives in that manifest.
cairn-analytics = { path = "../cairn-analytics" }
cairn-codec = { path = "../cairn-codec" }
cairn-vcs = { path = "../cairn-vcs" }
cairn-cell = { path = "../cairn-cell" }

# The database layer (domain models, table records, and the storage engine with
# its full-text search index) descends into cairn-db; cairn-core re-exports it at
# the original crate paths through a thin storage facade. cairn-db is also the
# sole owner of the turso + rustls edges: cairn-core reaches every `turso::` type
# and the `params!` macro through the `cairn_db::turso` re-export (and its rustls
# crypto-provider install through `storage::install_crypto_provider`), so it no
# longer names either crate in this manifest.
cairn-db = { path = "../cairn-db" }

# Optional: test utilities (mocking)
mockall = { version = "0.13", optional = true }
jsonwebtoken = "9.3.1"
lsp-types = "0.97"
# HTML→markdown for the built-in "regular" web-fetch provider. A turndown.js
# inspired pure-Rust converter; only `text/html` responses are converted, JSON
# and text/markdown pass through unchanged.
htmd = "0.5"
pdf-extract = "0.12"
matfile = "0.5"

# OS keychain access for MCP server secrets. Backend is selected per target so a
# Finder-launched app (minimal process env) still resolves token-bearing
# servers. Declared per-target to avoid pulling secret-service/dbus deps into
# the macOS/Windows builds.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation"] }

# Linux: keyring (secret-service) for MCP secrets + landlock for the OS-level
# worktree-fence sandbox (origin/main).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }

# Process enumeration for the worktree process reaper (execution::teardown /
# worktree_gc): resolve each pid's cwd to SIGKILL detached process trees rooted
# in a worktree being torn down (macOS: proc_pidinfo(PROC_PIDVNODEPATHINFO) +
# proc_listallpids; Linux: /proc/<pid>/cwd). libproc was evaluated first but its
# pidcwd is hardcoded to error on macOS, so it cannot resolve a cwd on the
# platform this targets; libc is already in the tree transitively via nix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cairn-config = { path = "../cairn-config", features = ["test-utils"] }
cairn-vcs = { path = "../cairn-vcs", features = ["test-utils"] }
cairn-platform = { path = "../cairn-platform", features = ["test-utils"] }
async-trait = "0.1"
filetime = "0.2"
mockall = "0.13"
serde_json = "1.0"
serial_test = "3"
tempfile = "3"
# `test-util` gives tests the pausable clock. A schedule whose whole job is to
# decide WHEN work may run has to be asserted on a clock, not on a sleep.
# `rt-multi-thread` is what lets a test stand up a runtime shaped like the one
# the transport serves invokes on, which is where keychain reads actually run
# (tests/main/keychain_runtime.rs).
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
cairn-core = { path = ".", features = ["test-utils"] }
cairn-codec = { path = "../cairn-codec", features = ["test-utils"] }
cairn-db = { path = "../cairn-db", features = ["test-utils"] }

[features]
internal-api = []
test-utils = ["cairn-models/test-utils", "cairn-attention/test-utils", "cairn-workflow/test-utils", "cairn-session/test-utils", "cairn-platform/test-utils", "dep:mockall", "internal-api", "cairn-db/test-utils"]

[[example]]
name = "compute_vibe_axes"
required-features = ["internal-api"]

[[example]]
name = "vibe_corpus_dump"
required-features = ["internal-api"]

[[example]]
name = "backfill_resource_embeddings"
required-features = ["internal-api"]

[[example]]
name = "concurrent_db_probe"
required-features = ["internal-api"]

[[example]]
name = "vacuum_reclaim"
required-features = ["internal-api"]

[[example]]
name = "db_lock_probe"
required-features = ["internal-api"]
