[package]
name = "cairn-session"
version.workspace = true
edition = "2021"
license = "BUSL-1.1"
description = "Agent session runtime and provider process protocols"

[dependencies]
cairn-analytics = { path = "../cairn-analytics" }
cairn-attention = { path = "../cairn-attention" }
cairn-common = { path = "../cairn-common" }
cairn-db = { path = "../cairn-db" }
cairn-models = { path = "../cairn-models" }
cairn-domain = { path = "../cairn-domain" }
cairn-platform = { path = "../cairn-platform" }
cairn-tokenize = { path = "../cairn-tokenize" }
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "5"
libc = "0.2"
log = "0.4"
nix = { version = "0.29", features = ["signal"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiktoken-rs = "0.6"
tokio = { version = "1", features = ["rt", "time", "net"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }


[dev-dependencies]
cairn-models = { path = "../cairn-models", features = ["test-utils"] }
cairn-db = { path = "../cairn-db", features = ["test-utils"] }
cairn-platform = { path = "../cairn-platform", features = ["test-utils"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
test-utils = ["cairn-models/test-utils", "cairn-platform/test-utils", "cairn-db/test-utils"]
