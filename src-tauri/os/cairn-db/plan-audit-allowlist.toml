# Gating plan-audit findings that production and the Rust suite both accept.
#
# `cairn_db::storage::plan_audit` flags a statement that walks a wide row. A
# flagged statement listed here logs at INFO in production, naming its issue,
# and reads as `allowlisted` in the suite's ledger. Anything else that gates logs
# a WARN and fails the `rust-tests` lane as a named finding.
#
# One stanza per statement. Identity is (file, rule, table, statement), with no
# line number, so unrelated edits that shift a line never touch this file:
#
# - `file` is the call site's `Location::file()` verbatim, so it has no
#   `src-tauri/` prefix.
# - `rule` is a gating rule: `wide-scan` or `trigger-scan`.
# - `statement` is the 16-hex hash the audit logs, of the statement's text with
#   whitespace collapsed. Editing the SQL changes the hash, so an edited
#   statement fails as new and is acknowledged again. A failing run prints a
#   ready-to-paste stanza.
# - `kind` says what `issue` is. `debt`: that issue owes this entry's removal.
#   `deliberate`: that issue records the ruling, for a bulk scan by design or a
#   statement only test code defines.
# - `issue` is a `cairn://p/cairn/NNNN` URI, and `reason` says why in a sentence.
#
# A whole-suite run that explains a listed statement and finds it clean fails the
# entry as stale. An entry whose statement no test reached is reported as unseen
# and does not fail, and rewriting a statement changes its hash, which leaves its
# old entry unseen rather than stale: a PR that rewrites a listed statement removes
# its entry itself. A branch's fast tier cannot call an entry stale, so an entry
# left behind first shows as main's whole-suite red.
#
# Flat `key = "value"` lines only: the runner parses this without a TOML library
# (`scripts/lib/plan-audit.ts`), because a runner dependency it could not load
# would cost the lane its verdict. The `plan-audit` lane parses it both ways.

# SELECT e.run_id FROM events e LEFT JOIN token_rollup_runs w ON w.run_id = e.run_
[[allow]]
file = "os/cairn-analytics/src/queries.rs"
rule = "wide-scan"
table = "events"
statement = "1c743583be722f9c"
kind = "debt"
issue = "cairn://p/cairn/6130"
reason = "The rollup's needing-fold read walks every event, inside its write transaction on the second run."

