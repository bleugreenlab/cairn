[package]
name = "cairn-models"
version.workspace = true
edition = "2021"
description = "The cairn-models facet: HTTP protocols, provider vocabulary, accounts and routing, and usage as data"
license = "BUSL-1.1"

# The facet's front door. Crates outside the facet import from here; the
# member crates exist for dependency weight (see docs/backends.md).
[dependencies]
cairn-llm-wire = { path = "../cairn-llm-wire" }
cairn-image-wire = { path = "../cairn-image-wire" }
cairn-speech-wire = { path = "../cairn-speech-wire" }
cairn-models-types = { path = "../cairn-models-types" }
cairn-credentials = { path = "../cairn-credentials" }
cairn-domain = { path = "../cairn-domain" }
cairn-platform = { path = "../cairn-platform" }
cairn-common = { path = "../cairn-common" }
cairn-tls = { path = "../cairn-tls" }
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
flate2 = "1"
hex = "0.4"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
# `off_runtime` hands a multi-thread worker's queue off with `block_in_place`
# before it waits on a blocking download.
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "windows")'.dependencies]
# session/codex/home.rs replaces the Codex config atomically with MoveFileExW.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
cairn-platform = { path = "../cairn-platform", features = ["test-utils"] }
# The codex-contract suite counts and measures the processes under a server.
cairn-procmem = { path = "../cairn-procmem" }
# The claude-contract suite reads a live process's launch environment.
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
test-utils = ["cairn-platform/test-utils"]
# The real-binary Codex contract suite (tests/codex_contract). Only
# `bun run codex:contract` enables it, so no ordinary test, lint, or
# full-suite run builds or selects the target.
codex-contract = []
# The real-binary Claude Code contract suite (tests/claude_contract), enabled
# only by `bun run claude:contract`.
claude-contract = []

[[test]]
name = "codex_contract"
path = "tests/codex_contract/main.rs"
required-features = ["codex-contract"]

[[test]]
name = "claude_contract"
path = "tests/claude_contract/main.rs"
required-features = ["claude-contract"]
