[package]
name = "cairn-models"
version.workspace = true
edition = "2021"
description = "The cairn-models facet: HTTP protocols, provider vocabulary, accounts and routing, and usage as data"
license = "BUSL-1.1"

# The facet's front door. Crates outside the facet import from here; the
# member crates exist for dependency weight (see docs/backends.md).
[dependencies]
cairn-llm-wire = { path = "../cairn-llm-wire" }
cairn-image-wire = { path = "../cairn-image-wire" }
cairn-models-types = { path = "../cairn-models-types" }
cairn-credentials = { path = "../cairn-credentials" }
cairn-domain = { path = "../cairn-domain" }
cairn-platform = { path = "../cairn-platform" }
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
# session/codex/home.rs replaces the Codex config atomically with MoveFileExW.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
cairn-platform = { path = "../cairn-platform", features = ["test-utils"] }
tempfile = "3"

[features]
test-utils = ["cairn-platform/test-utils"]
