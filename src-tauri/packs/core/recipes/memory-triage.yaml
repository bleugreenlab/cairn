cairnVersion: 1
bundles: [coding]
name: Memory Triage
description: Canonize a claimed batch of pending memories
trigger: manual
system: true
nodes:
- id: trigger-1
  type: trigger
  name: Trigger
  position: 240@90
  config:
    triggerType: manual
    scope: issue
- id: integrator-1
  type: agent
  name: Integrator
  position: 240@260
  config:
    agent: integrator
- id: pr-1
  type: pr
  name: PR
  position: 240@420
  config:
    actionParams: {}
    inputSchema:
      name: create-pr
      schema:
        properties:
          body:
            description: PR description (markdown)
            type: string
          title:
            description: PR title
            type: string
        required:
        - title
        - body
        type: object
      confirmPolicy: auto
edges:
- from: trigger-1@control-out
  to: integrator-1@control-in
  type: control
- from: trigger-1@context-out
  to: integrator-1@context-in
  type: context
- from: integrator-1@control-out
  to: pr-1@control-in
  type: control
- from: integrator-1@context-out
  to: pr-1@context-in
  type: context
