name: Followed thread stream
description: Deliver followed-thread segments to the phone only while the operator is away.
enabled: true
nodes:
  - id: thread-stream
    type: trigger
    name: Followed thread, away
    when:
      fact: thread_stream
      presence: away
  - id: phone
    type: sink
    name: Phone
    sink:
      kind: channel
      register: notify
      initiatedBy: operator_subscription
edges:
  - from: thread-stream
    to: phone
dedupe: 10m
